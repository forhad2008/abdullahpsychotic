<style>

:root{
  --black:#050505;
  --black2:#090909;
  --card:#0b0b0b;
  --white:#ffffff;
  --soft-white:#eeeeee;
  --muted:#9a9a9a;
  --border:rgba(255,255,255,.10);

  --heading:"Playfair Display",serif;
  --subheading:"Cinzel",serif;
  --body:"Montserrat",sans-serif;
}


/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050505;
  color:#fff;
  font-family:var(--body);
  overflow-x:hidden;
}

body.locked{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

img{
  max-width:100%;
  display:block;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-track{
  background:#050505;
}

::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:86px;

  display:grid;
  grid-template-columns:70px 1fr 70px;
  align-items:center;

  background:#050505;

  border-bottom:1px solid rgba(255,255,255,.10);
}


.menu-btn,
.cart-btn{
  position:relative;

  width:38px;
  height:38px;

  margin:auto;

  padding:0;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.2s;

  -webkit-tap-highlight-color:transparent;
}

.menu-btn:hover,
.cart-btn:hover{
  transform:scale(1.06);
}

.menu-btn:active,
.cart-btn:active{
  transform:scale(.92);
}

.menu-btn svg,
.cart-btn svg{
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-btn svg{
  width:25px;
  height:20px;
}

.cart-btn svg{
  width:23px;
  height:23px;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
  justify-self:center;

  width:150px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:130px;
  height:auto;

  object-fit:contain;
}


/* =========================================================
   CART COUNT
========================================================= */

.cart-count{
  position:absolute;

  top:-3px;
  right:-5px;

  width:17px;
  height:17px;

  border-radius:50%;

  background:#fff;
  color:#050505;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:8px;
  font-weight:700;

  border:1px solid #050505;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.76);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.3s;

  z-index:1100;
}

.overlay.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}


/* =========================================================
   MENU DRAWER
========================================================= */

.menu-drawer{
  position:fixed;

  top:0;
  left:-380px;

  width:350px;
  max-width:88vw;
  height:100dvh;

  z-index:1300;

  background:#080808;

  border-right:1px solid var(--border);

  box-shadow:18px 0 55px rgba(0,0,0,.6);

  padding:28px;

  display:flex;
  flex-direction:column;

  transition:left .42s cubic-bezier(.77,0,.175,1);
}

.menu-drawer.active{
  left:0;
}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:22px;

  border-bottom:1px solid var(--border);
}

.menu-brand{
  font-family:var(--subheading);

  font-size:11px;

  letter-spacing:2px;

  color:#fff;
}

.menu-close{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  border-radius:50%;

  background:#111;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  cursor:pointer;

  transition:.2s;
}

.menu-close:hover{
  background:#fff;
  color:#050505;
}

.menu-links{
  display:flex;
  flex-direction:column;

  gap:5px;

  padding-top:24px;
}

.menu-links a{
  display:flex;
  align-items:center;

  padding:15px 14px;

  color:#ccc;

  border-radius:6px;

  font-size:12px;

  letter-spacing:1.5px;

  transition:.25s;
}

.menu-links a:hover{
  color:#fff;
  background:#111;
  padding-left:18px;
}

.menu-bottom{
  margin-top:auto;

  color:#555;

  text-align:center;

  font-size:9px;

  letter-spacing:2px;
}


/* =========================================================
   PRODUCTS PAGE
========================================================= */

.products-page{
  width:100%;
  max-width:1200px;

  margin:auto;

  padding:28px 16px 70px;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-list{
  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:16px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
  position:relative;

  min-width:0;

  background:#0b0b0b;

  border:1px solid rgba(255,255,255,.08);

  overflow:hidden;

  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.product-card:hover{
  transform:translateY(-3px);

  border-color:rgba(255,255,255,.20);

  box-shadow:
    0 15px 35px rgba(0,0,0,.55);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{
  position:relative;

  display:block;

  width:100%;

  height:245px;

  overflow:hidden;

  background:#080808;

  border-bottom:1px solid rgba(255,255,255,.07);
}

.product-image::after{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      transparent 65%,
      rgba(0,0,0,.18)
    );
}

.product-image img{
  width:100%;
  height:100%;

  object-fit:contain;

  padding:5px;

  filter:
    drop-shadow(
      0 12px 18px rgba(0,0,0,.65)
    );

  transition:transform .45s ease;
}

.product-card:hover
.product-image img{
  transform:scale(1.035);
}


/* =========================================================
   PLUS BUTTON
   IMPORTANT:
   It stays INSIDE image only.
   Therefore product information can NEVER
   hide behind it.
========================================================= */

.product-plus{
  position:absolute;

  right:14px;
  bottom:14px;

  z-index:10;

  width:48px;
  height:48px;

  border:0;

  background:#fff;

  color:#050505;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:46px;

  font-family:Arial,sans-serif;
  font-weight: 300;

  line-height:1;

  cursor:pointer;

  box-shadow:
    0 5px 20px rgba(0,0,0,.45);

  transition:
    transform .2s ease,
    background .2s ease,
    color .2s ease;
}

.product-plus:hover{
  transform:scale(1.06);

  background:#050505;

  color:#fff;
}

.product-plus:active{
  transform:scale(1.6);
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
  position:relative;

  min-height:112px;

  padding:15px 15px 16px;

  background:#0b0b0b;

  color:#fff;
}


/* BRAND */
.product-badge{
  color:#bdbdbd;

  font-family:var(--subheading);

  font-size:8px;

  font-weight:500;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:7px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* PRODUCT NAME */
.product-name{
  color:#fff;

  font-family:var(--body);

  font-size:16px;

  font-weight:500;

  line-height:1.35;

  margin:0;

  padding-right:0;
}


/* DESCRIPTION */

.product-description{
  display:none;
}


/* PRICE */

.product-price{
  color:#fff;

  font-size:15px;

  font-weight:600;

  margin-top:9px;
}


/* SOLD OUT */

.sold-out{
  width:100%;

  height:34px;

  margin-top:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  color:#050505;

  font-size:10px;

  font-weight:700;

  letter-spacing:1.5px;
}


/* =========================================================
   CART DRAWER
========================================================= */

.cart-drawer{
  position:fixed;

  top:0;
  right:0;
  bottom:0;

  width:min(430px,90vw);

  height:100dvh;

  background:#080808;

  border-left:1px solid var(--border);

  z-index:9999;

  display:flex;
  flex-direction:column;

  transform:translateX(100%);

  transition:
    transform .38s
    cubic-bezier(.77,0,.175,1);

  box-shadow:-18px 0 55px rgba(0,0,0,.6);

  overflow:hidden;
}

.cart-drawer.active{
  transform:translateX(0);
}


/* =========================================================
   CART HEADER
========================================================= */

.cart-header{
  flex-shrink:0;

  min-height:76px;

  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--border);

  background:#050505;
}

.cart-header h2{
  margin:0;

  font-family:var(--subheading);

  font-size:15px;

  letter-spacing:2.5px;
}

.cart-close{
  width:40px;
  height:40px;

  border:1px solid #222;

  background:#fff;

  color:#050505;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  cursor:pointer;

  transition:.2s;
}

.cart-close:hover{
  background:#050505;
  color:#fff;
  border-color:#fff;
}


/* =========================================================
   CART ITEMS
========================================================= */

.cart-items{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:18px 22px;
}

.empty{
  text-align:center;

  color:#777;

  margin-top:70px;

  font-family:var(--heading);

  font-size:15px;
}


/* CART ITEM */

.cart-item{
  position:relative;

  display:grid;

  grid-template-columns:72px minmax(0,1fr) 34px;

  gap:12px;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid var(--border);
}

.cart-item img{
  width:72px;
  height:82px;

  object-fit:contain;

  background:#111;
}

.cart-item-info{
  min-width:0;
}

.cart-item-name{
  color:#fff;

  font-family:var(--heading);

  font-size:12px;

  line-height:1.35;
}

.cart-item-size{
  color:#aaa;

  font-size:10px;

  margin-top:5px;

  letter-spacing:.8px;
}

.cart-item-price{
  color:#fff;

  font-size:12px;

  margin-top:6px;

  font-weight:600;
}


/* =========================================================
   QUANTITY
========================================================= */

.qty{
  display:flex;
  align-items:center;

  gap:8px;

  margin-top:10px;
}

.qty button{
  width:27px;
  height:27px;

  border:1px solid #333;

  background:#111;

  color:#fff;

  cursor:pointer;
}

.qty button:hover{
  background:#fff;
  color:#050505;
}

.qty span{
  min-width:14px;

  text-align:center;

  font-size:11px;
}


/* =========================================================
   REMOVE
========================================================= */

.remove{
  align-self:start;

  width:34px;
  height:34px;

  border:1px solid #222;

  background:#111;

  color:#aaa;

  font-size:21px;

  cursor:pointer;
}

.remove:hover{
  background:#fff;
  color:#050505;
}


/* =========================================================
   CART FOOTER
========================================================= */

.cart-footer{
  flex-shrink:0;

  border-top:1px solid var(--border);

  padding:18px 22px 22px;

  background:#050505;
}

.total{
  display:flex;
  align-items:center;
  justify-content:space-between;

  font-family:var(--subheading);

  font-size:14px;

  letter-spacing:.5px;

  margin-bottom:15px;
}

.checkout{
  width:100%;

  height:52px;

  border:1px solid #fff;

  background:#fff;

  color:#050505;

  font-weight:700;

  letter-spacing:2px;

  cursor:pointer;

  transition:.2s;
}

.checkout:hover{
  background:#050505;

  color:#fff;
}


/* =========================================================
   OPTIONS OVERLAY
========================================================= */

.options-overlay{
  position:fixed;

  inset:0;

  z-index:2000;

  background:rgba(0,0,0,.78);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:.25s;
}

.options-overlay.active{
  opacity:1;

  visibility:visible;

  pointer-events:auto;
}


/* =========================================================
   OPTIONS WINDOW
========================================================= */

.options-window{
  position:fixed;

  left:50%;
  bottom:0;

  transform:translate(-50%,105%);

  width:min(720px,100%);

  max-height:92dvh;

  background:#f5f5f5;

  color:#111;

  z-index:2100;

  border-radius:20px 20px 0 0;

  overflow:hidden;

  box-shadow:
    0 -20px 70px rgba(0,0,0,.6);

  transition:
    transform .42s
    cubic-bezier(.77,0,.175,1);

  display:flex;
  flex-direction:column;
}

.options-overlay.active
.options-window{
  transform:translate(-50%,0);
}


/* =========================================================
   OPTIONS HEADER
========================================================= */

.options-header{
  flex:0 0 auto;

  height:78px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  border-bottom:1px solid #ddd;
}

.options-header h2{
  font-family:var(--subheading);

  font-size:18px;

  font-weight:500;

  letter-spacing:3px;
}

.options-close{
  width:42px;
  height:42px;

  border:0;

  background:transparent;

  color:#111;

  font-size:32px;

  cursor:pointer;
}


/* =========================================================
   OPTIONS BODY
========================================================= */

.options-body{
  overflow-y:auto;

  padding:22px 30px 30px;
}

.option-product{
  display:grid;

  grid-template-columns:170px 1fr;

  gap:25px;

  align-items:center;

  margin-bottom:24px;
}

.option-image{
  width:170px;
  height:190px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e9e9e9;

  overflow:hidden;
}

.option-image img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.option-product-info h3{
  font-family:var(--heading);

  font-size:22px;

  font-weight:500;

  line-height:1.25;

  margin-bottom:8px;
}

.option-price{
  color:#666;

  font-size:15px;

  letter-spacing:2px;

  margin-bottom:14px;
}


/* =========================================================
   OPTION LABEL
========================================================= */

.option-label{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;
}

.option-label span:first-child{
  font-size:15px;

  font-weight:500;

  letter-spacing:1px;
}

.size-chart{
  color:#222;

  font-size:12px;

  text-decoration:underline;

  cursor:pointer;
}


/* =========================================================
   SIZE OPTIONS
========================================================= */

.size-options{
  display:flex;

  flex-wrap:wrap;

  gap:8px;
}

.size-btn{
  min-width:58px;

  height:45px;

  padding:0 13px;

  border:1px solid #c9c9c9;

  background:transparent;

  color:#444;

  font-size:13px;

  cursor:pointer;

  transition:.2s;
}

.size-btn:hover{
  border-color:#111;

  color:#111;
}

.size-btn.selected{
  background:#050505;

  border-color:#050505;

  color:#fff;
}


/* =========================================================
   CONFIRM
========================================================= */

.confirm-add{
  width:100%;

  height:53px;

  border:0;

  background:#050505;

  color:#fff;

  font-size:14px;

  letter-spacing:3px;

  font-weight:500;

  cursor:pointer;
}

.confirm-add:disabled{
  opacity:.35;

  cursor:not-allowed;
}


/* =========================================================
   DESKTOP / LAPTOP / LARGE DEVICES
   TRUE DESKTOP DESIGN — MOBILE HAS ITS OWN DESIGN
========================================================= */

@media (min-width:769px){

  body{
    background:
      radial-gradient(circle at 50% -30%,rgba(255,255,255,.055),transparent 38%),
      #050505;
  }

  /* HEADER */
  header{
    height:96px;
    padding:0 48px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);
    align-items:center;
    background:rgba(5,5,5,.94);
    border-bottom:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .menu-btn{
    display:none !important;
  }

  .desktop-nav{
    grid-column:1;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:30px;
  }

  .desktop-nav a{
    position:relative;
    color:#a0a0a0;
    font-family:var(--subheading);
    font-size:9px;
    font-weight:500;
    letter-spacing:1.9px;
    white-space:nowrap;
    transition:color .25s ease;
  }

  .desktop-nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-10px;
    width:0;
    height:1px;
    background:#fff;
    transition:width .28s ease;
  }

  .desktop-nav a:hover{
    color:#fff;
  }

  .desktop-nav a:hover::after{
    width:100%;
  }

  .logo{
    grid-column:2;
    justify-self:center;
    width:190px;
  }

  .logo img{
    width:150px;
  }

  .cart-btn{
    grid-column:3;
    justify-self:end;
    width:46px;
    height:46px;
    margin:0;
  }

  .cart-btn svg{
    width:26px;
    height:26px;
  }

  .cart-count{

/* =========================================================
   SOLD OUT
========================================================= */

const soldOut = [];


/* =========================================================
   CART
========================================================= */

let cart =
  JSON.parse(
    localStorage.getItem("ap_user_cart")
  ) || [];


/* =========================================================
   CURRENT PRODUCT
========================================================= */

let optionProduct = null;
let selectedSize = null;


/* =========================================================
   OPTIONS
========================================================= */

function getOptions(product){

  if(
    product.category === "apparel" ||
    product.category === "hoodies"
  ){

    return {
      label:"Size",

      values:[
        "S",
        "M",
        "L",
        "XL",
        "XXL"
      ]
    };

  }


  if(product.category === "footwear"){

    return {
      label:"Size",

      values:[
        "39",
        "40",
        "41",
        "42",
        "43",
        "44",
        "45"
      ]
    };

  }


  return {
    label:"Size",

    values:[
      "ONE SIZE"
    ]
  };

}


/* =========================================================
   SAVE CART & BACKEND SYNCHRONIZATION
========================================================= */

const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyHik2t4HnaeQsY9A992qOPdMHxjV0YeS-pcSnfisZYwJW5JJbH55RxhRHPHbGO2hztSA/exec';
let syncCartTimer = null;

function syncCartToBackend() {
  const email = (localStorage.getItem("ap_underworld_email") || "").toLowerCase();
  if (!email || !email.includes("@")) return;

  clearTimeout(syncCartTimer);
  syncCartTimer = setTimeout(() => {
    const cb = "shopSaveCartCb_" + Date.now();
    const script = document.createElement("script");
    window[cb] = function() {
      try { delete window[cb]; } catch(e){}
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    script.onerror = function() {
      try { delete window[cb]; } catch(e){}
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const params = new URLSearchParams({
      action: "save_cart",
      email: email,
      items: JSON.stringify(cart),
      callback: cb
    });
    script.src = `${BACKEND_URL}?${params.toString()}`;
    document.head.appendChild(script);
  }, 400);
}

function fetchCartFromBackend() {
  const email = (localStorage.getItem("ap_underworld_email") || "").toLowerCase();
  if (!email || !email.includes("@")) return;

  const cb = "shopGetCartCb_" + Date.now();
  const script = document.createElement("script");
  window[cb] = function(res) {
    try { delete window[cb]; } catch(e){}
    if (script.parentNode) script.parentNode.removeChild(script);

    if (res && res.ok && Array.isArray(res.items)) {
      if (res.items.length > 0) {
        if (!cart || cart.length === 0) {
          cart = res.items;
          localStorage.setItem("ap_user_cart", JSON.stringify(cart));
          updateCart();
        }
      }
    }
  };
  script.onerror = function() {
    try { delete window[cb]; } catch(e){}
    if (script.parentNode) script.parentNode.removeChild(script);
  };
  const params = new URLSearchParams({
    action: "get_cart",
    email: email,
    callback: cb
  });
  script.src = `${BACKEND_URL}?${params.toString()}`;
  document.head.appendChild(script);
}

function saveCart(){

  localStorage.setItem(
    "ap_user_cart",
    JSON.stringify(cart)
  );

  syncCartToBackend();

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

  const list =
    document.getElementById(
      "product-list"
    );


  list.innerHTML =
    products.map(product => {

      const sold =
        soldOut.includes(product.id);


      return `

        <article class="product-card">

          <div class="product-image">

            <a
              href="${product.url}"
              target="_blank"
            >

              <img
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
              >

            </a>


            ${
              sold

              ?

              `

                <div
                  class="product-plus"
                  style="
                    background:#222;
                    color:#777;
                    cursor:not-allowed;
                    font-size:12px;
                  "
                >
                  SOLD
                </div>

              `

              :

              `

                <button class="product-plus"
        onclick="openOptions(${product.id})">
  +
</button>

              `
            }

          </div>


          <div class="product-info">

            <div class="product-badge">
              ${product.badge}
            </div>


            <h2 class="product-name">
              ${product.name}
            </h2>


            <div class="product-price">
              $${product.price.toLocaleString()} USD
            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   OPEN OPTIONS
========================================================= */

function openOptions(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;


  optionProduct = product;

  selectedSize = null;


  document.getElementById(
    "option-image"
  ).src = product.image;


  document.getElementById(
    "option-image"
  ).alt = product.name;


  document.getElementById(
    "option-name"
  ).textContent =
    product.name;


  document.getElementById(
    "option-price"
  ).textContent =
    "$" +
    product.price.toLocaleString() +
    " USD";


  const options =
    getOptions(product);


  document.getElementById(
    "option-label"
  ).textContent =
    options.label;


  const sizeBox =
    document.getElementById(
      "size-options"
    );


  sizeBox.innerHTML =
    options.values.map(
      value => `

        <button
          class="size-btn"
          onclick="selectSize(this,'${value}')"
        >
          ${value}
        </button>

      `
    ).join("");


  document.getElementById(
    "confirm-add"
  ).disabled = true;


  document.getElementById(
    "options-overlay"
  ).classList.add("active");


  document.body.classList.add(
    "locked"
  );

}


/* =========================================================
   SELECT SIZE
========================================================= */

function selectSize(button,size){

  document
    .querySelectorAll(".size-btn")
    .forEach(btn => {

      btn.classList.remove(
        "selected"
      );

    });


  button.classList.add(
    "selected"
  );


  selectedSize = size;


  document.getElementById(
    "confirm-add"
  ).disabled = false;

}


/* =========================================================
   ADD TO CART
========================================================= */

function confirmAddToCart(){

  if(!optionProduct){
    return;
  }

  if(!selectedSize){
    return;
  }


  const existing =
    cart.find(
      item =>
        item.id === optionProduct.id &&
        item.size === selectedSize
    );


  if(existing){
    if(Number(existing.qty || 0) >= 3){
      alert("Notice: Maximum 3 units per item allowed.");
      return;
    }
    existing.qty++;
  }else{

    cart.push({

      ...optionProduct,

      size:selectedSize,

      qty:1

    });

  }


  saveCart();

  updateCart();

  closeOptions();

  openCart();

}


/* =========================================================
   CLOSE OPTIONS
========================================================= */

function closeOptions(){

  document
    .getElementById(
      "options-overlay"
    )
    .classList.remove("active");


  optionProduct = null;

  selectedSize = null;


  if(
    !document
      .getElementById("cart-drawer")
      .classList.contains("active")
    &&
    !document
      .getElementById("menu-drawer")
      .classList.contains("active")
  ){

    document.body.classList.remove(
      "locked"
    );

  }

}


/* =========================================================
   SIZE CHART
========================================================= */

function showSizeChart(){

  alert(
`SIZE GUIDE

M — Medium
L — Large

XXL — Extra Extra Large

Shoes:
39 / 40 / 41 / 42 / 43 / 44 / 45

  );

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQty(id,size,amount){

  const item =
    cart.find(
      p =>
        p.id === id &&
        p.size === size
    );


  if(!item) return;


  item.qty += amount;


  if(item.qty <= 0){

    cart =
      cart.filter(
        p =>
          !(
            p.id === id &&
            p.size === size
          )
      );

  }


  saveCart();

  updateCart();

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(id,size){

  cart =
    cart.filter(
      p =>
        !(
          p.id === id &&
          p.size === size
        )
    );


  saveCart();

  updateCart();

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateCart(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  document.getElementById(
    "cart-count"
  ).textContent = count;


  const subtotal =
    cart.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  document.getElementById(
    "subtotal"
  ).textContent =
    "$" +
    subtotal.toLocaleString();


  const box =
    document.getElementById(
      "cart-items"
    );


  if(!cart.length){

    box.innerHTML = `

      <div class="empty">
        Your shopping bag is empty.
      </div>

    `;

    return;

  }


  box.innerHTML =
    cart.map(
      item => `

        <div class="cart-item">

          <img
            src="${item.image}"
            alt="${item.name}"
          >


          <div class="cart-item-info">

            <div class="cart-item-name">
              ${item.name}
            </div>


            <div class="cart-item-size">
              SIZE: ${item.size}
            </div>


            <div class="cart-item-price">
              $${item.price.toLocaleString()}
            </div>


            <div class="qty">

              <button
                onclick="changeQty(
                  ${item.id},
                  '${item.size}',
                  -1
                )"
              >
                −
              </button>


              <span>
                ${item.qty}
              </span>


              <button
                onclick="changeQty(
                  ${item.id},
                  '${item.size}',
                  1
                )"
              >
                +
              </button>

            </div>

          </div>


          <button
            class="remove"
            onclick="removeItem(
              ${item.id},
              '${item.size}'
            )"
          >
            ×
          </button>

        </div>

      `
    ).join("");

}

========================================================= */

  if(!cart.length){

    alert(
      "Your cart is empty!"

    return;

  window.location.href =
    "cart.html";

    if(e.key === "Escape"){
